<app-modal [visible]="showModal" [title]="title" size="medium" (onClose)="closeModal()">
  @if (loading) {
    <app-loader size="small" text="Loading..." />
  } @else {
    <form [formGroup]="form">
      <fieldset [disabled]="viewMode" class="grid grid-cols-1 gap-4">
        <app-form-field
          [formGroup]="form"
          controlName="name"
          label="Class Name"
          [required]="true"
          [submitted]="submitted"
          placeholder="e.g. CLASS 1"
          [minLength]="2"
          [maxLength]="200"
          [uppercase]="true" />

        <app-form-field
          [formGroup]="form"
          controlName="code"
          label="Code"
          placeholder="e.g. CLS-01"
          [maxLength]="50"
          [uppercase]="true" />

        <app-form-field
          [formGroup]="form"
          controlName="academic_level"
          label="Academic Level"
          fieldType="select"
          [required]="true"
          [submitted]="submitted"
          [options]="academicLevelOptions"
          selectPlaceholder="Select level" />

        <app-form-field
          [formGroup]="form"
          controlName="strength"
          label="Strength"
          placeholder="e.g. 40"
          [digitsOnly]="true"
          [maxLength]="5" />

        <app-form-field
          [formGroup]="form"
          controlName="notes"
          label="Notes"
          fieldType="textarea"
          placeholder="Any additional notes..."
          [rows]="3"
          [maxLength]="500" />

        <app-form-field
          [formGroup]="form"
          controlName="is_active"
          label="Active"
          fieldType="checkbox" />
      </fieldset>
    </form>
  }

  <div modal-footer class="flex justify-end gap-3">
    <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="closeModal()">
      {{ viewMode ? 'Back' : 'Cancel' }}
    </app-button>
    @if (viewMode) {
      @if (ps.canEdit(moduleCode)) {
        <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button" (buttonClick)="switchToEdit()">
          Edit
        </app-button>
      }
    } @else {
      <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button" [loading]="saving" (buttonClick)="submit()">
        {{ mode === 'edit' ? 'Update' : 'Create' }}
      </app-button>
    }
  </div>
</app-modal>
