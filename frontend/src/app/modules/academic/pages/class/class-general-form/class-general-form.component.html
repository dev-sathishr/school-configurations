<div class="mx-auto max-w-4xl">
  <div class="mb-6">
    <app-breadcrumb></app-breadcrumb>
  </div>

  @if (errorMessage) {
    <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
  }

  @if (loading) {
    <app-loader size="large" text="Loading class..." />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Class Information</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <app-form-field [formGroup]="form" controlName="name" label="Class Name" [required]="true" [submitted]="submitted"
            placeholder="e.g. CLASS 1" [minLength]="2" [maxLength]="200" [uppercase]="true" />
          <app-form-field [formGroup]="form" controlName="code" label="Code"
            placeholder="e.g. CLS-01" [maxLength]="50" [uppercase]="true" />
          <app-form-field [formGroup]="form" controlName="academic_level" label="Academic Level" fieldType="select"
            [required]="true" [submitted]="submitted" [options]="academicLevelOptions" selectPlaceholder="Select level" />
          <app-form-field [formGroup]="form" controlName="strength" label="Strength"
            placeholder="e.g. 40" [digitsOnly]="true" [minLength]="1" [maxLength]="5" />
        </div>
      </div>

      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <div class="grid grid-cols-1 items-center gap-4 md:grid-cols-2">
          <app-form-field [formGroup]="form" controlName="is_active" label="Active" fieldType="checkbox" />
          <app-form-field [formGroup]="form" controlName="notes" label="Notes" fieldType="textarea" [rows]="3"
            placeholder="Any additional notes..." [maxLength]="500" />
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="cancel()">
          Cancel
        </app-button>
        <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="submit" [loading]="saving">
          {{ editMode ? 'Update' : 'Create' }}
        </app-button>
      </div>
    </form>
  }
</div>
