<app-modal [visible]="showModal" [title]="title" size="medium" (onClose)="closeModal()">
  @if (loading) {
    <app-loader size="small" text="Loading..." />
  } @else {
    <form [formGroup]="form">
      <fieldset [disabled]="viewMode" class="grid grid-cols-1 gap-4">
        <app-location-field
          [formGroup]="form"
          [submitted]="submitted"
          [recordLocation]="recordLocation()" />

        <app-form-field
          [formGroup]="form"
          controlName="class_general_id"
          label="Class"
          fieldType="async-select"
          asyncUrl="/classes/dropdown"
          [required]="true"
          [submitted]="submitted"
          [initialLabel]="classLabel"
          selectPlaceholder="Select class" />

        <app-form-field
          [formGroup]="form"
          controlName="name"
          label="Name"
          placeholder="Auto-filled from class"
          [maxLength]="200" />

        <app-form-field
          [formGroup]="form"
          controlName="section"
          label="Section"
          fieldType="select"
          [options]="sectionOptions"
          selectPlaceholder="Select section" />

        <app-form-field
          [formGroup]="form"
          controlName="code"
          label="Code"
          [required]="true"
          [submitted]="submitted"
          placeholder="e.g. CLASS 1 A"
          [maxLength]="100"
          [uppercase]="true" />

        <app-form-field
          [formGroup]="form"
          controlName="capacity"
          label="Capacity"
          placeholder="e.g. 40"
          [submitted]="submitted"
          [digitsOnly]="true"
          [maxLength]="5" />

        <app-form-field
          [formGroup]="form"
          controlName="notes"
          label="Notes"
          fieldType="textarea"
          placeholder="Any additional notes..."
          [rows]="3"
          [maxLength]="500" />

        <app-form-field
          [formGroup]="form"
          controlName="is_active"
          label="Active"
          fieldType="checkbox" />
      </fieldset>
    </form>
  }

  <div modal-footer class="flex justify-end gap-3">
    <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="closeModal()">
      {{ viewMode ? 'Back' : 'Cancel' }}
    </app-button>
    @if (viewMode) {
      @if (ps.canEdit(moduleCode)) {
        <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button" (buttonClick)="switchToEdit()">
          Edit
        </app-button>
      }
    } @else {
      <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button" [loading]="saving" (buttonClick)="submit()">
        {{ mode === 'edit' ? 'Update' : 'Create' }}
      </app-button>
    }
  </div>
</app-modal>
