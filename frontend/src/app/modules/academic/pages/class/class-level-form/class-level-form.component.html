<div class="mx-auto max-w-4xl">
  <div class="mb-6">
    <app-breadcrumb></app-breadcrumb>
  </div>

  @if (errorMessage) {
    <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
  }

  @if (loading) {
    <app-loader size="large" text="Loading section..." />
  } @else {
    <!-- Section Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">{{ editMode ? 'Edit Section' : 'Add Section' }}</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <app-location-field [formGroup]="form" [submitted]="submitted"
            [recordLocation]="recordLocation()" />
          <app-form-field [formGroup]="form" controlName="class_general_id" label="Class" fieldType="async-select"
            asyncUrl="/classes/dropdown" [required]="true" [submitted]="submitted" [initialLabel]="classLabel" selectPlaceholder="Select class" />
          <app-form-field [formGroup]="form" controlName="name" label="Section Name" [required]="true" [submitted]="submitted"
            placeholder="e.g. A, B, C" [maxLength]="100" />
          <app-form-field [formGroup]="form" controlName="capacity" label="Capacity" fieldType="number"
            placeholder="e.g. 40" />
        </div>
      </div>

      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <div class="grid grid-cols-1 items-center gap-4 md:grid-cols-2">
          <app-form-field [formGroup]="form" controlName="is_active" label="Active" fieldType="checkbox" />
          <app-form-field [formGroup]="form" controlName="notes" label="Notes" fieldType="textarea" [rows]="3"
            placeholder="Any additional notes..." [maxLength]="500" />
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="cancel()">
          Cancel
        </app-button>
        <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="submit" [loading]="saving">
          {{ editMode ? 'Update' : 'Save' }}
        </app-button>
      </div>
    </form>

    <!-- Sections List (below the form) -->
    @if (levelsApiUrl) {
      <div class="mt-8">
        <div class="border-border mb-4 border-t pt-6">
          <h4 class="text-foreground text-sm font-semibold">Sections List</h4>
          <p class="text-muted-foreground mt-1 text-xs">Existing sections for the selected class</p>
        </div>

        <app-table
          [apiUrl]="levelsApiUrl"
          [deleteUrl]="levelsDeleteUrl"
          [columns]="levelsColumns"
          [displayKeyMap]="levelsDisplayKeyMap"
          [rowTransform]="levelsRowTransform"
          [extraParams]="locationCtx.scopeExtraParams()"
          [canEdit]="ps.canEdit('CLASSES')"
          [canDelete]="ps.canDelete('CLASSES')"
          (onEdit)="editLevel($event)">
        </app-table>
      </div>
    }
  }
</div>
