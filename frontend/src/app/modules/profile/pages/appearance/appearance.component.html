<div class="bg-background border-border rounded-lg border p-6">
  <h2 class="text-foreground mb-1 text-lg font-semibold">Appearance</h2>
  <p class="text-muted-foreground mb-6 text-sm">Changes are saved automatically and follow you across devices.</p>

  <!-- Menu layout -->
  <div class="mb-6">
    <span class="text-foreground mb-2 block text-xs font-semibold uppercase">Menu Layout</span>
    <div class="grid max-w-md grid-cols-2 gap-2">
      <button
        type="button"
        (click)="setMenuStyle('sidebar')"
        [ngClass]="{ 'border-primary bg-primary/5 text-primary': themeService.theme().menuStyle === 'sidebar' }"
        class="border-border text-muted-foreground hover:bg-muted hover:text-foreground inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-lg border text-xs font-medium transition-colors">
        <svg-icon src="assets/icons/heroicons/outline/menu.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        <span>Sidebar</span>
      </button>
      <button
        type="button"
        (click)="setMenuStyle('header')"
        [ngClass]="{ 'border-primary bg-primary/5 text-primary': themeService.theme().menuStyle === 'header' }"
        class="border-border text-muted-foreground hover:bg-muted hover:text-foreground inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-lg border text-xs font-medium transition-colors">
        <svg-icon src="assets/icons/heroicons/outline/view-grid.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        <span>Horizontal</span>
      </button>
    </div>
  </div>

  <!-- Mode -->
  <div class="mb-6">
    <span class="text-foreground mb-2 block text-xs font-semibold uppercase">Mode</span>
    <div class="grid max-w-md grid-cols-2 gap-2">
      @for (item of themeMode; track $index) {
        <button
          type="button"
          (click)="setMode(item)"
          [ngClass]="{ 'border-primary bg-primary/5 text-primary': item === themeService.theme().mode }"
          class="border-border text-muted-foreground hover:bg-muted hover:text-foreground inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-lg border text-xs font-medium transition-colors">
          <svg-icon
            [src]="item === 'light' ? 'assets/icons/heroicons/outline/sun.svg' : 'assets/icons/heroicons/outline/moon.svg'"
            [svgClass]="'h-4 w-4'">
          </svg-icon>
          <span class="capitalize">{{ item }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Direction -->
  <div class="mb-6">
    <span class="text-foreground mb-2 block text-xs font-semibold uppercase">Direction</span>
    <div class="grid max-w-md grid-cols-2 gap-2">
      @for (item of themeDirection; track $index) {
        <button
          type="button"
          (click)="setDirection(item)"
          [ngClass]="{ 'border-primary bg-primary/5 text-primary': item === themeService.theme().direction }"
          class="border-border text-muted-foreground hover:bg-muted hover:text-foreground inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-lg border text-xs font-medium transition-colors">
          <svg-icon
            [src]="item === 'ltr' ? 'assets/icons/tablericons/text-direction-ltr.svg' : 'assets/icons/tablericons/text-direction-rtl.svg'"
            [svgClass]="'h-4 w-4'">
          </svg-icon>
          <span class="uppercase">{{ item }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Accent color -->
  <div>
    <span class="text-foreground mb-2 block text-xs font-semibold uppercase">Accent Color</span>
    <div class="flex flex-wrap gap-2">
      @for (item of themeColors; track item.name) {
        <button
          type="button"
          (click)="setColor(item.name)"
          [ngClass]="{ 'ring-2 ring-offset-2 ring-primary': item.name === themeService.theme().color }"
          class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-full transition-all"
          [style.backgroundColor]="item.code"
          [title]="item.name">
        </button>
      }
    </div>
  </div>
</div>
