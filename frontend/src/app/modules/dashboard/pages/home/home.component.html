<div class="p-4">
  <div class="mb-6">
    <h2 class="text-foreground text-xl font-semibold">Dashboard</h2>
    <p class="text-muted-foreground text-sm">Welcome to ShaanthiEd</p>
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <app-school-overview *appHasPermission="['SCHOOL_OVERVIEW', 'VIEW']"></app-school-overview>
    <app-academic-summary *appHasPermission="['ACADEMIC_SUMMARY', 'VIEW']"></app-academic-summary>
    <app-fee-collection *appHasPermission="['FEE_COLLECTION', 'VIEW']"></app-fee-collection>
    <app-my-classes *appHasPermission="['MY_CLASSES', 'VIEW']"></app-my-classes>
    <app-my-grades *appHasPermission="['MY_GRADES', 'VIEW']"></app-my-grades>
    <app-child-progress *appHasPermission="['CHILD_PROGRESS', 'VIEW']"></app-child-progress>
  </div>
</div>
