<div class="border-border bg-background/80 hidden border-t md:block">
  <div class="mx-auto px-5">
    <div class="flex items-center gap-1 py-1.5">
      @for (menu of menuService.pagesMenu; track menu.group) {
        @for (item of menu.items; track item.route) {
          <a
            routerLink="{{ item.route }}"
            routerLinkActive="bg-primary text-primary-foreground"
            class="text-muted-foreground bg-muted/50 hover:bg-muted hover:text-foreground rounded-md px-3 py-1.5 text-sm font-medium transition-colors">
            {{ item.label }}
          </a>
        }
      }
    </div>
  </div>
</div>
