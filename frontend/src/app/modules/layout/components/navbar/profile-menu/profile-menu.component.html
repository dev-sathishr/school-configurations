<div class="relative ml-3" clickOutside (clickOutside)="isOpen = false">
  <!-- Profile Button -->
  <button (click)="toggleMenu()" class="bg-card relative flex rounded-full text-sm" type="button">
    <span class="sr-only">Open user menu</span>
    @if (profileImageUrl) {
      <img class="size-9 shrink-0 rounded-md object-cover" [src]="profileImageUrl" alt="" (error)="onImageError()" />
    } @else {
      <div class="bg-primary/10 text-primary flex size-9 shrink-0 items-center justify-center rounded-md text-sm font-semibold">
        {{ userInitial }}
      </div>
    }
  </button>

  <!-- Dropdown -->
  <div
    [@openClose]="isOpen ? 'open' : 'closed'"
    class="bg-background shadow-custom border-muted absolute z-20 mt-2 w-72 origin-top-right transform rounded-lg border py-0 ring-1 ring-transparent ring-opacity-5 transition focus:outline-hidden ltr:right-0 rtl:left-0">

    <!-- User Info -->
    <div class="flex items-center gap-3 px-4 py-4">
      @if (profileImageUrl) {
        <img class="h-10 w-10 shrink-0 rounded-lg object-cover" [src]="profileImageUrl" alt="" (error)="onImageError()" />
      } @else {
        <div class="bg-primary/10 text-primary flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-sm font-semibold">
          {{ userInitial }}
        </div>
      }
      <div class="overflow-hidden">
        <p class="text-foreground truncate text-sm font-semibold">{{ currentUser?.full_name || 'User' }}</p>
        <p class="text-muted-foreground truncate text-xs">{{ currentUser?.email || '' }}</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="border-border border-t p-3">
      <a
        routerLink="/profile"
        (click)="isOpen = false"
        class="text-muted-foreground hover:bg-card hover:text-primary inline-flex w-full cursor-pointer items-center gap-2.5 rounded-md px-3 py-2.5 text-xs font-semibold transition-colors">
        <svg-icon src="./assets/icons/heroicons/outline/user-circle.svg" [svgClass]="'h-4 w-4 text-muted-foreground/50'"></svg-icon>
        Your Profile
      </a>
      <hr class="border-border my-2 border-dashed" />
      <button
        (click)="logout()"
        class="text-muted-foreground hover:bg-red-50 hover:text-red-600 inline-flex w-full cursor-pointer items-center gap-2.5 rounded-md px-3 py-2.5 text-xs font-semibold transition-colors">
        <svg-icon src="./assets/icons/heroicons/outline/logout.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        Log out
      </button>
    </div>
  </div>
</div>
