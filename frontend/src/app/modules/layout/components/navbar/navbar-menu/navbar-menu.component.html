@for (menu of menuService.pagesMenu; track menu.group) {
  @for (item of menu.items; track item.route) {
    <div class="inline-block">
      <a
        routerLink="{{ item.route }}"
        routerLinkActive="bg-primary text-primary-foreground"
        class="text-muted-foreground/50 hover:bg-card hover:text-muted-foreground mr-2 inline-flex rounded-md px-3 py-2 text-sm font-medium">
        <span>{{ item.label }}</span>
      </a>
    </div>
  }
}
