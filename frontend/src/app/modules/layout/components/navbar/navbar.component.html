<div class="bg-background">
  <div class="mx-auto px-5">
    <div class="flex items-center justify-between py-3.5">
      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button
          (click)="toggleMobileMenu()"
          type="button"
          class="bg-muted text-muted-foreground focus:ring-primary hover:bg-muted-foreground hover:text-muted inline-flex items-center justify-center rounded-md p-2 focus:outline-hidden focus:ring-2 focus:ring-inset">
          <svg-icon src="assets/icons/heroicons/outline/menu.svg" [svgClass]="'h-6 w-6'"> </svg-icon>
        </button>
      </div>

      <!-- Logo (header mode only) -->
      @if (themeService.theme().menuStyle !== 'sidebar') {
        <div class="flex items-center justify-start gap-3 ltr:mr-8 rtl:ml-8">
          <a class="flex items-center justify-center rounded-sm focus:outline-hidden focus:ring-1">
            <img src="assets/icons/shaanthi-logo.png" alt="ShaanthiEd" class="h-10 w-auto object-contain" />
          </a>
          <b class="text-foreground hidden text-sm font-bold sm:block">ShaanthiEd</b>
        </div>
      }

      <!-- Search bar & Favorites -->
      <div class="hidden items-center gap-4 md:flex">
        <!-- Search -->
        <div class="border-border relative flex items-center rounded-md border">
          <input type="text" placeholder="Type to search..."
            class="text-foreground placeholder:text-muted-foreground h-9 w-64 rounded-md border-0 bg-transparent py-1.5 pl-3 pr-9 text-sm focus:outline-hidden" />
          <svg-icon src="assets/icons/heroicons/outline/magnifying-glass.svg"
            [svgClass]="'absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground'"> </svg-icon>
        </div>

        <!-- Divider -->
        <div class="bg-border h-6 w-px"></div>

        <!-- Favorite icons -->
        @for (fav of favorites; track fav.route) {
          <a [routerLink]="fav.route" class="group relative">
            <svg-icon [src]="fav.icon!" [svgClass]="'h-5 w-5 text-muted-foreground hover:text-foreground transition-colors cursor-pointer'"> </svg-icon>
            <span
              class="bg-foreground text-background pointer-events-none absolute left-1/2 top-full z-50 mt-2 -translate-x-1/2 scale-0 whitespace-nowrap rounded-md px-2.5 py-1.5 text-xs font-bold shadow-md transition-all duration-200 group-hover:scale-100">
              {{ fav.label }}
            </span>
          </a>
        }

        <!-- Choose favorites (using shared select-dropdown) -->
        <app-select-dropdown
          triggerType="custom"
          [options]="favoriteOptions"
          [multiSelect]="true"
          [selectedValues]="selectedFavoriteValues"
          (selectedValuesChange)="onFavoritesChange($event)"
          [headerText]="favoritesHeader"
          searchPlaceholder="Find menu item...">
          <button trigger type="button"
            class="text-muted-foreground hover:text-foreground flex cursor-pointer items-center gap-2 text-sm transition-colors">
            @if (favorites.length === 0) {
              <span>Choose favorites</span>
            }
            <svg-icon src="assets/icons/heroicons/solid/heart.svg" [svgClass]="'h-5 w-5 text-red-500'"> </svg-icon>
          </button>
        </app-select-dropdown>
      </div>

      <!-- Spacer -->
      <div class="flex-1"></div>

      <!-- Action icons & Profile -->
      <div class="flex items-center gap-1">
        <button class="text-muted-foreground hover:text-foreground hover:bg-muted hidden rounded-md p-2 transition-colors md:inline-flex">
          <svg-icon src="assets/icons/heroicons/outline/view-grid.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
        </button>
        <button class="text-muted-foreground hover:text-foreground hover:bg-muted hidden rounded-md p-2 transition-colors md:inline-flex">
          <svg-icon src="assets/icons/heroicons/outline/bell.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
        </button>
        <app-profile-menu></app-profile-menu>
      </div>
    </div>
  </div>
  <app-navbar-mobile></app-navbar-mobile>
</div>
