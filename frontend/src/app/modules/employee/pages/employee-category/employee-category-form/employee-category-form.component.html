<app-modal [visible]="showModal" [title]="title" size="medium" [draggable]="true" (onClose)="closeModal()">
  @if (loading) {
    <app-loader size="small" text="Loading..." />
  } @else {
    <form [formGroup]="form">
      <fieldset [disabled]="viewMode" class="grid grid-cols-1 gap-4">
        <app-form-field
          [formGroup]="form"
          controlName="name"
          label="Name"
          [required]="true"
          [submitted]="submitted"
          placeholder="e.g. Teaching Staff"
          [uppercase]="true" />

        <app-form-field
          [formGroup]="form"
          controlName="code"
          label="Code"
          [required]="true"
          [submitted]="submitted"
          placeholder="e.g. TEACHING_STAFF"
          [uppercase]="true" />

        <app-form-field
          [formGroup]="form"
          controlName="description"
          label="Description"
          fieldType="textarea"
          placeholder="Brief description"
          [rows]="3" />

        <app-form-field
          [formGroup]="form"
          controlName="is_active"
          label="Active"
          fieldType="checkbox" />
      </fieldset>
    </form>
  }

  <div modal-footer class="flex justify-end gap-3">
    <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="closeModal()">
      {{ viewMode ? 'Back' : 'Cancel' }}
    </app-button>
    @if (viewMode) {
      @if (ps.canEdit(moduleCode)) {
        <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button" (buttonClick)="switchToEdit()">
          Edit
        </app-button>
      }
    } @else {
      <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button" [loading]="saving" (buttonClick)="submit()">
        {{ mode === 'edit' ? 'Update' : 'Create' }}
      </app-button>
    }
  </div>
</app-modal>
