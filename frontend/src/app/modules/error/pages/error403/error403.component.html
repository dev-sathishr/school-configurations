<div class="bg-background flex max-w-lg flex-col items-center justify-center gap-3 rounded-lg p-8 text-center">
  <svg-icon src="assets/icons/heroicons/outline/shield-exclamation.svg" svgClass="h-14 w-14 text-muted-foreground"> </svg-icon>

  <h1 class="text-foreground text-4xl font-bold">{{ heading }}</h1>

  <p class="text-muted-foreground text-sm">
    {{ description }}
  </p>

  <p *ngIf="requestedPath" class="bg-muted text-muted-foreground w-full max-w-md break-all rounded-md px-3 py-2 text-xs">
    Requested path: {{ requestedPath }}
  </p>

  <p class="text-muted-foreground text-sm">Contact your administrator if you need access.</p>

  <div class="mt-2 flex items-center gap-2">
    <app-button (buttonClick)="goBack()" impact="bold" tone="primary" shape="rounded" size="medium">Go Back</app-button>
    <app-button (buttonClick)="goToHomePage()" impact="light" tone="light" shape="rounded" size="medium">Homepage</app-button>
  </div>
</div>
