<div class="bg-background flex max-w-lg flex-col items-center justify-center gap-3 rounded-lg p-8 text-center">
  <svg-icon src="assets/illustrations/404.svg" svgClass="w-[300px] h-[150px] text-muted-foreground"> </svg-icon>
  <h1 class="text-foreground text-4xl font-bold">Page Not Found</h1>
  <p class="text-muted-foreground text-sm">The page you are looking for does not exist or may have been moved.</p>

  <div class="mt-2 flex items-center gap-2">
    <app-button (buttonClick)="goBack()" impact="bold" tone="primary" shape="rounded" size="medium">Go Back</app-button>
    <app-button (buttonClick)="goToHomePage()" impact="light" tone="light" shape="rounded" size="medium">Homepage</app-button>
  </div>
</div>
