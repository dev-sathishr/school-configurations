@if (errorMessage) {
  <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
  <fieldset [disabled]="viewMode" class="space-y-5">

    <div class="bg-background border-muted/30 rounded-lg border p-5">
      <h4 class="text-foreground mb-4 text-sm font-semibold">Recommendation Details</h4>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

        <div class="flex items-end gap-2">
          <div class="flex-1">
            <app-form-field [formGroup]="form" controlName="recommender_id" label="Recommender"
              fieldType="async-select" [asyncUrl]="recommenderDropdownUrl"
              asyncLabelKey="name" asyncValueKey="id"
              [initialLabel]="selectedRecommenderLabel"
              selectPlaceholder="Select recommender"
              [required]="true" [submitted]="submitted" />
          </div>
          @if (!viewMode && ps.canCreate('RECOMMENDATIONS')) {
            <app-button impact="light" tone="primary" shape="rounded" size="medium" type="button"
              class="mb-0.5 shrink-0"
              (buttonClick)="openNewRecommender()">
              + New
            </app-button>
          }
        </div>

        @if (profileId && enquiryDropdownUrl) {
          <app-form-field [formGroup]="form" controlName="enquiry_id" label="Enquiry (optional)"
            fieldType="async-select" [asyncUrl]="enquiryDropdownUrl"
            asyncLabelKey="display_label" asyncValueKey="id"
            [initialLabel]="linkedEnquiryLabel"
            selectPlaceholder="Link to an enquiry" />
        }

        <app-form-field [formGroup]="form" controlName="is_active" label="Active"
          fieldType="checkbox" />

      </div>
    </div>

    <div class="bg-background border-muted/30 rounded-lg border p-5">
      <h4 class="text-foreground mb-4 text-sm font-semibold">Remarks</h4>
      <app-form-field [formGroup]="form" controlName="notes" label="Notes"
        fieldType="textarea" [rows]="3" placeholder="Any additional notes..." [maxLength]="500" />
    </div>

  </fieldset>
</form>

<!-- Quick-create recommender modal -->
<app-modal
  [visible]="newRecommenderModalVisible"
  title="New Recommender"
  size="large"
  [draggable]="true"
  (onClose)="newRecommenderModalVisible = false">

  <app-recommender-form
    #recommenderForm
    [inlineMode]="true"
    (savedInline)="onRecommenderSaved($event)"
    (cancelled)="newRecommenderModalVisible = false" />

  <div modal-footer class="flex justify-end gap-3">
    <app-button impact="light" tone="light" shape="rounded" size="medium" type="button"
      (buttonClick)="newRecommenderModalVisible = false">
      Cancel
    </app-button>
    <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button"
      [loading]="recommenderForm.saving"
      (buttonClick)="recommenderForm.onSubmit()">
      Save Recommender
    </app-button>
  </div>

</app-modal>
