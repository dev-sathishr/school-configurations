@if (errorMessage) {
  <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
  <fieldset [disabled]="viewMode" class="space-y-5">

      <!-- Enquiry Details -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <div class="mb-4 flex items-center justify-between">
          <h4 class="text-foreground text-sm font-semibold">Enquiry Details</h4>
          @if (!enquiryId && codeLoading) {
            <div class="border-primary h-3.5 w-3.5 animate-spin rounded-full border-2 border-t-transparent"></div>
          }
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <app-location-field [formGroup]="form" [submitted]="submitted"
            [recordLocation]="recordLocation()" />

          <app-form-field [formGroup]="form" controlName="academic_year_id" label="Academic Year"
            fieldType="async-select" [asyncUrl]="academicYearUrl" asyncLabelKey="label"
            [initialLabel]="academicYearLabel" selectPlaceholder="Select year" [required]="true" [submitted]="submitted" />

          <app-form-field [formGroup]="form" controlName="enquiry_date" label="Date"
            fieldType="date" [required]="true" [submitted]="submitted" [max]="todayDate" />

          <app-form-field [formGroup]="form" controlName="status" label="Status"
            fieldType="select" [options]="statusOptions" [required]="true" [submitted]="submitted" />
        </div>
      </div>

      <!-- Enquirer Info -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Enquirer Information</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <app-form-field [formGroup]="form" controlName="relation_type" label="Relation Type"
            fieldType="select" [options]="relationTypeOptions" [required]="true" [submitted]="submitted" />

          <app-form-field [formGroup]="form" controlName="enquired_by" label="Enquired By"
            placeholder="e.g. Ravi Kumar" [required]="true" [submitted]="submitted"
            [minLength]="3" [maxLength]="100" [lettersOnly]="true" [titlecase]="true" />

          <app-form-field [formGroup]="form" controlName="contact_no" label="Contact No"
            fieldType="phone" [required]="true" [submitted]="submitted" />


        </div>
      </div>

      <!-- Class Preference -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Class Preference</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <app-form-field [formGroup]="form" controlName="enquired_class" label="Enquired Class"
            fieldType="async-select" asyncUrl="/classes/dropdown" asyncLabelKey="name"
            selectPlaceholder="Select class general"
            [required]="true" [submitted]="submitted" />

          <app-form-field [formGroup]="form" controlName="current_school" label="Current School"
            placeholder="e.g. ABC Matriculation School" [maxLength]="100" />

          <app-form-field [formGroup]="form" controlName="current_curriculum" label="Current Curriculum"
            fieldType="async-select" asyncUrl="/curriculums/dropdown" asyncLabelKey="name"
            selectPlaceholder="Select curriculum" />

          <app-form-field [formGroup]="form" controlName="current_class" label="Current Class"
            placeholder="e.g. Grade 4" [maxLength]="100" />
        </div>
      </div>

      <!-- Remarks -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Remarks</h4>
        <app-form-field [formGroup]="form" controlName="notes" label="Remarks"
          fieldType="textarea" [rows]="3" placeholder="Any additional notes..." [maxLength]="500" />
      </div>

    </fieldset>

  </form>
