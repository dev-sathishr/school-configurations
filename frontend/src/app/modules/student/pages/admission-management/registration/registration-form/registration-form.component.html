@if (errorMessage) {
  <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
  <fieldset [disabled]="viewMode" class="space-y-5">

    <div class="bg-background border-muted/30 rounded-lg border p-5">
      <h4 class="text-foreground mb-4 text-sm font-semibold">Registration Details</h4>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

        @if (profileId && enquiryDropdownUrl) {
          <app-form-field [formGroup]="form" controlName="enquiry_id" label="Enquiry"
            fieldType="async-select" [asyncUrl]="enquiryDropdownUrl"
            asyncLabelKey="display_label" asyncValueKey="id"
            [initialLabel]="linkedEnquiryLabel"
            selectPlaceholder="Select an enquiry"
            [required]="true" [submitted]="submitted"
            (itemSelected)="onEnquirySelected($event)" />
        }

        <app-form-field [formGroup]="form" controlName="registration_date" label="Registration Date"
          fieldType="date" [required]="true" [submitted]="submitted"
          [min]="minDate" [max]="maxDate" />

        <app-form-field [formGroup]="form" controlName="academic_year_id" label="Academic Year"
          fieldType="async-select" [asyncUrl]="academicYearUrl" asyncLabelKey="label" asyncValueKey="id"
          [initialLabel]="selectedAcademicYearLabel"
          selectPlaceholder="Select year"
          [required]="true" [submitted]="submitted" />

        <app-form-field [formGroup]="form" controlName="sanctioned_class_id" label="Sanctioned Class"
          fieldType="async-select" [asyncUrl]="sanctionedClassUrl" asyncLabelKey="name" asyncValueKey="id"
          [initialLabel]="selectedSanctionedClassLabel"
          selectPlaceholder="Select class"
          [required]="true" [submitted]="submitted" />

        <app-form-field [formGroup]="form" controlName="is_active" label="Active"
          fieldType="checkbox" />

      </div>
    </div>

    <div class="bg-background border-muted/30 rounded-lg border p-5">
      <h4 class="text-foreground mb-4 text-sm font-semibold">Remarks</h4>
      <app-form-field [formGroup]="form" controlName="notes" label="Notes"
        fieldType="textarea" [rows]="3" placeholder="Any additional notes..." [maxLength]="500" />
    </div>

  </fieldset>
</form>
