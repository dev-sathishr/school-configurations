<div class="mx-auto max-w-7xl">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <app-breadcrumb />
    <app-button *appHasPermission="['ENGINE_META', 'CREATE']"
      impact="bold" tone="primary" shape="rounded" size="medium"
      (buttonClick)="addNew()">
      <span class="flex items-center gap-1.5">
        <span class="flex h-5 w-5 items-center justify-center rounded-full bg-white/20 text-base font-bold leading-none">+</span>
        New DocType
      </span>
    </app-button>
  </div>

  <app-table
    [apiUrl]="apiUrl"
    [columns]="columns"
    [displayKeyMap]="displayKeyMap"
    [rowTransform]="rowTransform"
    [canEdit]="ps.canEdit('ENGINE_META')"
    [canDelete]="ps.canDelete('ENGINE_META')"
    [canView]="ps.canView('ENGINE_META')"
    (onEdit)="editSelected($event)"
    (onView)="viewSelected($event)" />
</div>
