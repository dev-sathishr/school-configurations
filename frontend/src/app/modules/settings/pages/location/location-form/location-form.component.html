<div class="mx-auto max-w-4xl">
  <div class="mb-6">
    <app-breadcrumb></app-breadcrumb>
  </div>

  @if (errorMessage) {
    <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
  }

  @if (loading) {
    <app-loader size="large" text="Loading location..." />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <fieldset [disabled]="viewMode" class="space-y-6">

      <!-- Basic Info -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Basic Information</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <app-form-field [formGroup]="form" controlName="organization_id" label="Organization" fieldType="async-select"
            [required]="true" [submitted]="submitted" asyncUrl="/organizations/dropdown" selectPlaceholder="Select Organization" [initialLabel]="orgLabel" />
          <app-form-field [formGroup]="form" controlName="name" label="Name" [required]="true" [submitted]="submitted"
            placeholder="e.g. Main Campus" [minLength]="3" [maxLength]="100" />
          <app-form-field [formGroup]="form" controlName="code" label="Code"
            placeholder="e.g. LOC" [maxLength]="5" [minLength]="3" [uppercase]="true" [required]="true" [submitted]="submitted" />
          <app-form-field [formGroup]="form" controlName="type" label="Type" fieldType="select"
            [options]="locationTypes" [required]="true" [submitted]="submitted" />
          <app-form-field [formGroup]="form" controlName="email" label="Email" fieldType="email"
            placeholder="e.g. campus@school.com" [maxLength]="100" [submitted]="submitted" [lowercase]="true" />
        </div>
      </div>

      <!-- Contact -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Contact Details</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <app-form-field [formGroup]="form" controlName="primary_phone" label="Primary Contact" fieldType="phone"
            placeholder="Phone number" [maxLength]="15" [required]="true" [submitted]="submitted"
            siblingControlName="alternate_phone" />
          <app-form-field [formGroup]="form" controlName="alternate_phone" label="Alternate Contact" fieldType="phone"
            placeholder="Phone number" [maxLength]="15" siblingControlName="primary_phone" />
        </div>
      </div>

      <!-- Addresses -->
      <app-address [addresses]="addresses" (addressesChange)="onAddressesChange($event)" />
      @if (addressError) {
        <p class="-mt-4 text-xs text-red-500">{{ addressError }}</p>
      }

      <!-- Status & Notes -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <div class="grid grid-cols-1 items-center gap-4 md:grid-cols-2">
          <app-form-field [formGroup]="form" controlName="is_active" label="Active" fieldType="checkbox" />
          <app-form-field [formGroup]="form" controlName="notes" label="Notes" fieldType="textarea" [rows]="3"
            placeholder="Any additional notes..." [maxLength]="500" />
        </div>
      </div>

      </fieldset>

      <!-- Actions -->
      <div class="flex justify-end gap-3">
        <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="cancel()">
          {{ viewMode ? 'Back' : 'Cancel' }}
        </app-button>
        @if (viewMode) {
          @if (ps.canEdit('LOCATIONS')) {
            <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="button" (buttonClick)="switchToEdit()">
              Edit
            </app-button>
          }
        } @else {
          <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="submit" [loading]="saving">
            {{ editMode ? 'Update' : 'Create' }}
          </app-button>
        }
      </div>
    </form>
  }
</div>
