<div class="mb-4 flex items-center justify-between">
  <app-breadcrumb></app-breadcrumb>
  <app-button impact="bold" tone="primary" shape="rounded" size="medium" (buttonClick)="addNew()">
    + Add Location

</div>

<app-table

  [apiUrl]="apiUrl"

  (onEdit)="editSelected($event)">
</app-table>
