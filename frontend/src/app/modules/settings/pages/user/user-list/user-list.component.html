<div class="mb-4 flex justify-between">
  <div>
    <h3 class="text-foreground font-semibold">User Management</h3>
    <p class="text-muted-foreground text-xs">Total: {{ table.totalCount() }}</p>
  </div>
  <app-button impact="bold" tone="primary" shape="rounded" size="medium" (buttonClick)="addNew()">
    + Add User
  </app-button>
</div>

<app-table
  #table
  [apiUrl]="apiUrl"
  [deleteUrl]="deleteUrl"
  [columns]="columns"
  [displayKeyMap]="displayKeyMap"
  [rowTransform]="rowTransform"
  (onEdit)="editSelected($event)">
</app-table>
