<div>
  <div class="mb-6">
    <app-breadcrumb></app-breadcrumb>
  </div>

  @if (errorMessage) {
    <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
  }

  @if (loading) {
    <app-loader size="large" text="Loading user..." />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Account Info -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Account Information</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <app-form-field [formGroup]="form" controlName="username" label="Username" [required]="true" [submitted]="submitted" placeholder="e.g. john_doe" />
          <app-form-field [formGroup]="form" controlName="password" label="Password" fieldType="password"
            [required]="!editMode" [submitted]="submitted" [placeholder]="editMode ? 'Leave blank to keep current' : 'Enter password'" />
          <app-form-field [formGroup]="form" controlName="role" label="Role" fieldType="select"
            [required]="true" [submitted]="submitted" [options]="roleOptions" />
        </div>
      </div>

      <!-- Personal Info -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Personal Information</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <app-form-field [formGroup]="form" controlName="full_name" label="Full Name" [required]="true" [submitted]="submitted" placeholder="e.g. John Doe" />
          <app-form-field [formGroup]="form" controlName="email" label="Email" fieldType="email" placeholder="e.g. john@example.com" />
          <app-form-field [formGroup]="form" controlName="phone" label="Phone" placeholder="e.g. 9876543210" />
        </div>
      </div>

      <!-- Status -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <app-form-field [formGroup]="form" controlName="is_active" label="Active" fieldType="checkbox" />
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3">
        <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="cancel()">
          Cancel
        </app-button>
        <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="submit" [loading]="saving">
          {{ editMode ? 'Update' : 'Create' }}
        </app-button>
      </div>
    </form>
  }
</div>
