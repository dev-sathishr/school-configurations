<div class="mb-6">
  <app-breadcrumb></app-breadcrumb>
</div>

<div class="mb-4 flex items-center justify-between">
  <div>
    <h2 class="text-foreground text-xl font-semibold">Academic Years</h2>
    <p class="text-muted-foreground text-sm">Set up school calendars for each location. One year per location is the default.</p>
  </div>
  <app-button *appHasPermission="['ACADEMIC_YEARS', 'CREATE']"
    impact="bold" tone="primary" shape="rounded" size="medium" (buttonClick)="addNew()">
    + New Academic Year
  </app-button>
</div>

<app-table
  [apiUrl]="apiUrl"
  [deleteUrl]="deleteUrl"
  [columns]="columns"
  [displayKeyMap]="displayKeyMap"
  [rowTransform]="rowTransform"
  [extraParams]="locationCtx.scopeExtraParams()"
  [canEdit]="ps.canEdit('ACADEMIC_YEARS')"
  [canDelete]="ps.canDelete('ACADEMIC_YEARS')"
  (onEdit)="editSelected($event)"
  (onView)="viewSelected($event)">
</app-table>
