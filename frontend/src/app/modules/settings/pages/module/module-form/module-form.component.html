<div class="mx-auto max-w-4xl">
  <div class="mb-6">
    <app-breadcrumb></app-breadcrumb>
  </div>

  @if (errorMessage) {
    <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600">{{ errorMessage }}</div>
  }

  @if (loading) {
    <app-loader size="large" text="Loading module..." />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Module Info -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Module Information</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <app-form-field [formGroup]="form" controlName="name" label="Name" [required]="true" [submitted]="submitted" placeholder="e.g. Settings" />
          <app-form-field [formGroup]="form" controlName="code" label="Code" [required]="true" [submitted]="submitted" placeholder="e.g. SETTINGS" />
          <app-form-field [formGroup]="form" controlName="icon" label="Icon" placeholder="e.g. assets/icons/heroicons/outline/cog.svg" />
        </div>
      </div>

      <!-- Route & Order -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <h4 class="text-foreground mb-4 text-sm font-semibold">Navigation</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <app-form-field [formGroup]="form" controlName="route_path" label="Route Path" placeholder="e.g. /settings" />
          <app-form-field [formGroup]="form" controlName="display_order" label="Display Order" placeholder="e.g. 1" />
          <app-form-field [formGroup]="form" controlName="description" label="Description" fieldType="textarea" placeholder="Brief description of the module" />
        </div>
      </div>

      <!-- Status -->
      <div class="bg-background border-muted/30 rounded-lg border p-5">
        <app-form-field [formGroup]="form" controlName="is_active" label="Active" fieldType="checkbox" />
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3">
        <app-button impact="light" tone="light" shape="rounded" size="medium" type="button" (buttonClick)="cancel()">
          Cancel
        </app-button>
        <app-button impact="bold" tone="primary" shape="rounded" size="medium" type="submit" [loading]="saving">
          {{ editMode ? 'Update' : 'Create' }}
        </app-button>
      </div>
    </form>
  }
</div>
