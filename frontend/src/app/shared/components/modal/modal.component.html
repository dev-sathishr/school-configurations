@if (visible) {
  <!-- Backdrop -->
  <!-- Backdrop - covers full screen -->
  <div class="fixed inset-0 z-50 bg-black/50" (click)="onBackdropClick()"></div>
  <!-- Dialog - centers within content area, offset for sidebar on lg+ -->
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none transition-[left] duration-300"
    [ngClass]="{
      'lg:left-[210px] xl:left-[280px]': sidebarExpanded,
      'lg:left-[70px]': sidebarCollapsed
    }">
    <div class="bg-background max-h-[90vh] w-full overflow-y-auto rounded-xl border border-muted/30 shadow-xl pointer-events-auto"
      [ngClass]="sizeClass"
      (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="border-muted/20 flex items-center justify-between border-b px-6 py-4">
        <h3 class="text-foreground text-lg font-semibold">{{ title }}</h3>
        @if (showClose) {
          <button type="button" (click)="close()"
            class="text-muted-foreground hover:text-foreground rounded-lg p-1 transition-colors hover:bg-muted/20">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        }
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <ng-content></ng-content>
      </div>

      <!-- Footer -->
      <div class="border-muted/20 border-t px-6 py-4">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
