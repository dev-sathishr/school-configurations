@if (visible) {
  <!-- Backdrop -->
  <div class="fixed inset-0 z-50 bg-black/50" (click)="onBackdropClick()"></div>
  <!-- Dialog -->
  <div class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="bg-background pointer-events-auto flex max-h-[90vh] w-full flex-col rounded-xl border border-muted/30 shadow-xl"
      [ngClass]="sizeClass"
      (click)="$event.stopPropagation()">

      <!-- Header (sticky) -->
      <div class="border-muted/20 flex shrink-0 items-center justify-between border-b px-6 py-4">
        <h3 class="text-foreground text-lg font-semibold">{{ title }}</h3>
        @if (showClose) {
          <button type="button" (click)="close()"
            class="text-muted-foreground hover:text-foreground rounded-lg p-1 transition-colors hover:bg-muted/20">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        }
      </div>

      <!-- Body (scrollable) -->
      <div class="scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted grow overflow-y-auto px-6 py-5">
        <ng-content></ng-content>
      </div>

      <!-- Footer (sticky) -->
      <div class="border-muted/20 shrink-0 border-t px-6 py-4">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
