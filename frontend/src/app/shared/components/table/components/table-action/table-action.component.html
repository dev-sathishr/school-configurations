<div class="flex flex-wrap items-center justify-between gap-2 py-3 px-5">
  <!-- Left: Search, Filters, Columns -->
  <div class="flex flex-wrap items-center gap-2">
    <!-- Global Search -->
    <div class="flex">
      <label class="text-muted-foreground relative">
        <div class="absolute left-2.5 top-2.5">
          <svg-icon src="./assets/icons/heroicons/outline/magnifying-glass.svg" [svgClass]="'h-4 w-4'"> </svg-icon>
        </div>
        <input
          name="search"
          class="h-[34px] py-0 pl-8 pr-2"
          placeholder="Search..."
          type="text"
          value=""
          (input)="onSearchChange($event)" />
      </label>
    </div>

    <!-- Filters Toggle -->
    <button
      (click)="toggleFilters()"
      class="flex h-[34px] items-center gap-1.5 rounded-md border border-muted/50 bg-background px-3 text-xs font-medium text-muted-foreground hover:text-foreground"
      [class.border-primary]="filterService.showFilters()"
      [class.text-primary]="filterService.showFilters()">
      <svg-icon src="./assets/icons/heroicons/outline/cursor-click.svg" [svgClass]="'h-3.5 w-3.5'"></svg-icon>
      Filters
    </button>

    <!-- Column Visibility Toggle -->
    <div class="relative">
      <button
        (click)="toggleColumnsDropdown()"
        class="flex h-[34px] items-center gap-1.5 rounded-md border border-muted/50 bg-background px-3 text-xs font-medium text-muted-foreground hover:text-foreground"
        [class.border-primary]="showColumnsDropdown"
        [class.text-primary]="showColumnsDropdown">
        <svg-icon src="./assets/icons/heroicons/outline/adjustments-horizontal.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        Columns
        @if (hiddenColumnCount > 0) {
          <span class="bg-primary text-primary-foreground ml-0.5 flex h-4 w-4 items-center justify-center rounded-full text-[10px] font-bold">
            {{ hiddenColumnCount }}
          </span>
        }
      </button>
      @if (showColumnsDropdown) {
        <div class="bg-background border-muted absolute left-0 z-50 mt-1 w-48 rounded-md border shadow-lg sm:left-auto sm:right-0">
          <div class="max-h-60 overflow-y-auto p-2">
            @for (col of columns; track col.key) {
              <label class="hover:bg-card flex cursor-pointer items-center gap-2 rounded px-2 py-1.5 text-xs">
                <input
                  type="checkbox"
                  [checked]="isColumnVisible(col)"
                  (change)="toggleColumn(col)"
                  class="rounded" />
                <span class="text-foreground">{{ col.label }}</span>
              </label>
            }
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Right: Selected count + Edit/Delete icons -->
  <div class="flex items-center gap-2">
    @if (selectedCount() > 0) {
      <span class="text-muted-foreground text-xs font-medium">{{ selectedCount() }} selected</span>
      @if (isSingleSelected()) {
        <button
          (click)="onEditSelected.emit()"
          title="Edit selected"
          class="flex h-[34px] w-[34px] items-center justify-center rounded-md border border-muted/50 bg-background text-blue-500 hover:bg-blue-50">
          <svg-icon src="./assets/icons/heroicons/outline/pencil.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        </button>
      }
      <button
        (click)="onDeleteSelected.emit()"
        title="Delete selected"
        class="flex h-[34px] w-[34px] items-center justify-center rounded-md border border-muted/50 bg-background text-red-500 hover:bg-red-50">
        <svg-icon src="./assets/icons/heroicons/outline/trash.svg" [svgClass]="'h-4 w-4'"></svg-icon>
      </button>
    }
  </div>
</div>
