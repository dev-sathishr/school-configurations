<div class="text-muted-foreground flex flex-wrap items-center justify-between gap-2 py-3 px-5 text-xs">
  <div class="order-2 flex items-center gap-4 md:order-1">
    <span class="text-muted-foreground/70">Showing {{ rangeStart() }}-{{ rangeEnd() }} of {{ totalCount() }} records</span>
    <div class="flex items-center gap-2">
      Show
      <select class="w-16 p-2" (change)="onPageSizeChange($event)">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
      </select>
      per page
    </div>
  </div>
  <div class="order-1 flex items-center gap-4 md:order-2">
    <span>{{ rangeStart() }}-{{ rangeEnd() }} of {{ totalCount() }}</span>
    <div class="inline-flex items-center gap-1">
      <button
        (click)="prev()"
        [disabled]="currentPage() === 1"
        class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-sm disabled:opacity-50">
        <svg-icon src="./assets/icons/heroicons/outline/arrow-long-left.svg" [svgClass]="'h-4 w-4'"> </svg-icon>
      </button>
      @for (page of pageNumbers(); track $index) {
        @if (page === '...') {
          <span class="inline-flex h-7 w-7 items-center justify-center text-sm">...</span>
        } @else {
          <button
            (click)="goToPage(page)"
            [class]="page === currentPage()
              ? 'bg-muted-foreground/10 inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-sm'
              : 'hover:bg-muted-foreground/10 inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-sm'">
            {{ page }}
          </button>
        }
      }
      <button
        (click)="next()"
        [disabled]="currentPage() === totalPages()"
        class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-sm disabled:opacity-50">
        <svg-icon src="./assets/icons/heroicons/outline/arrow-long-right.svg" [svgClass]="'h-4 w-4'"> </svg-icon>
      </button>
    </div>
  </div>
</div>
