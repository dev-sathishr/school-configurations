@if (fieldType === 'checkbox') {
  <div [class]="colSpan" [formGroup]="formGroup">
    <div class="flex items-center gap-2">
      <input type="checkbox" [id]="fieldId" [formControlName]="controlName" class="rounded" />
      <label [for]="fieldId" class="text-foreground text-sm font-medium">{{ label }}</label>
    </div>
  </div>
} @else {
  <div [class]="colSpan" [formGroup]="formGroup">
    <label class="text-foreground mb-1 block text-xs font-medium">{{ label }}@if (required) {<span class="ml-0.5 text-red-500">*</span>}</label>

    @if (fieldType === 'select') {
      <app-select-dropdown
        [options]="options"
        [value]="control?.value || ''"
        (valueChange)="onSelectChange($event)"
        (closed)="onSelectClosed()"
        [placeholder]="selectPlaceholder || 'Select...'"
        [hasError]="hasError">
      </app-select-dropdown>
    } @else if (fieldType === 'async-select') {
      <app-select-dropdown
        [asyncUrl]="asyncUrl"
        [asyncValueKey]="asyncValueKey"
        [asyncLabelKey]="asyncLabelKey"
        [value]="control?.value || ''"
        (valueChange)="onSelectChange($event)"
        (closed)="onSelectClosed()"
        [placeholder]="selectPlaceholder || 'Select...'"
        [hasError]="hasError"
        [initialLabel]="initialLabel">
      </app-select-dropdown>
    } @else if (fieldType === 'textarea') {
      <textarea [formControlName]="controlName" [rows]="rows" [placeholder]="placeholder"
        [attr.maxlength]="maxLength"
        [ngClass]="{ 'border-red-500!': hasError }"
        class="border-muted bg-background text-foreground w-full rounded-md border px-3 py-2 text-sm focus:border-primary focus:outline-none"></textarea>
    } @else if (fieldType === 'phone') {
      <app-form-field-phone
        [formGroup]="formGroup"
        [controlName]="controlName"
        [label]="label"
        [placeholder]="placeholder"
        [required]="required"
        [submitted]="submitted" />
    } @else {
      <input [type]="fieldType" [formControlName]="controlName" [placeholder]="placeholder"
        [attr.maxlength]="maxLength"
        [ngClass]="{ 'border-red-500!': hasError, 'uppercase!': uppercase, 'lowercase!': lowercase }"
        (input)="digitsOnly ? toDigits() : uppercase ? toUppercase() : lowercase ? toLowercase() : null"
        class="border-muted bg-background text-foreground w-full rounded-md border px-3 py-2 text-sm focus:border-primary focus:outline-none" />
    }

    @if (fieldType !== 'phone' && hasError && errorMessage) {
      <span class="mt-1 block text-xs text-red-500">{{ errorMessage }}</span>
    }
  </div>
}
